<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Turnos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        .editable {
            cursor: pointer;
        }
        .editable:hover {
            background-color: #f9f9f9;
        }
        button {
            margin-bottom: 20px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Calendario de Turnos</h1>
    <button id="generarTurnos">Generar Turnos</button>
    <table id="calendario">
        <thead>
            <tr>
                <th>Día</th>
                <th>Mañana (5)</th>
                <th>Tarde (4)</th>
                <th>Noche (1)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Aquí se generará el calendario -->
        </tbody>
    </table>

    <script>
        const diasDelMes = 30; // Número de días en el mes
        const numDespachadores = 23;
        const turnos = {
            mañana: 5,
            tarde: 4,
            noche: 1
        };

        let despachadores = Array.from({ length: numDespachadores }, (_, i) => `D${i + 1}`);
        let calendarioData = [];

        function generarTurnos() {
            calendarioData = [];
            let contadorNoche = 0;
            let turnoNocheActivo = false;
            let diasDescanso = 0;

            for (let dia = 1; dia <= diasDelMes; dia++) {
                let mañana = [];
                let tarde = [];
                let noche = [];

                // Asignar turnos de mañana y tarde
                mañana = despachadores.slice(0, turnos.mañana);
                tarde = despachadores.slice(turnos.mañana, turnos.mañana + turnos.tarde);

                // Asignar turno de noche
                if (!turnoNocheActivo && diasDescanso === 0) {
                    noche.push(despachadores[(contadorNoche % numDespachadores)]);
                    turnoNocheActivo = true;
                    diasDescanso = 4; // 4 noches seguidas
                } else if (turnoNocheActivo) {
                    noche.push(despachadores[(contadorNoche % numDespachadores)]);
                    diasDescanso--;
                    if (diasDescanso === 0) {
                        turnoNocheActivo = false;
                        contadorNoche++;
                        diasDescanso = 3; // 1 día antes + 2 días después
                    }
                }

                calendarioData.push({ día: dia, mañana, tarde, noche });
            }

            renderizarCalendario();
        }

        function renderizarCalendario() {
            const tbody = document.querySelector("#calendario tbody");
            tbody.innerHTML = "";

            calendarioData.forEach(({ día, mañana, tarde, noche }) => {
                const row = document.createElement("tr");

                // Día
                const cellDia = document.createElement("td");
                cellDia.textContent = día;
                row.appendChild(cellDia);

                // Mañana
                const cellManana = document.createElement("td");
                cellManana.textContent = mañana.join(", ");
                cellManana.classList.add("editable");
                cellManana.addEventListener("click", () => editarCelda(cellManana, día, "mañana"));
                row.appendChild(cellManana);

                // Tarde
                const cellTarde = document.createElement("td");
                cellTarde.textContent = tarde.join(", ");
                cellTarde.classList.add("editable");
                cellTarde.addEventListener("click", () => editarCelda(cellTarde, día, "tarde"));
                row.appendChild(cellTarde);

                // Noche
                const cellNoche = document.createElement("td");
                cellNoche.textContent = noche.join(", ");
                cellNoche.classList.add("editable");
                cellNoche.addEventListener("click", () => editarCelda(cellNoche, día, "noche"));
                row.appendChild(cellNoche);

                tbody.appendChild(row);
            });
        }

        function editarCelda(celda, día, turno) {
            const nuevosValores = prompt(`Editar turnos para el día ${día} (${turno}):`, celda.textContent);
            if (nuevosValores !== null) {
                const valoresArray = nuevosValores.split(",").map(valor => valor.trim());
                const index = calendarioData.findIndex(item => item.día === día);
                if (index !== -1) {
                    calendarioData[index][turno] = valoresArray;
                    renderizarCalendario();
                }
            }
        }

        document.getElementById("generarTurnos").addEventListener("click", generarTurnos);

        // Generar turnos al cargar la página
        generarTurnos();
    </script>
</body>
</html>
</body>
</html>
