<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Turnos Inteligente</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      border-collapse: collapse;
      margin-bottom: 20px;
      width: 100%;
    }
    th, td {
      border: 1px solid #000;
      padding: 5px;
      text-align: center;
      font-size: 13px;
    }
    .controls {
      margin-bottom: 20px;
    }
    .controls button {
      margin-right: 10px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
    }
    h2 {
      margin-top: 30px;
    }
    .off {
      color: #999;
    }
    /* Las casillas bloqueadas por el usuario o asignadas como domingo libre
       se mostrarán en un color distinto para diferenciarlas de las "off" normales. */
    .blocked {
      background-color: #fdd;
    }
  </style>
</head>
<body>
  <h1>Calendario de Turnos Inteligente</h1>
  <div class="controls">
    <button onclick="generarTurnos()">Generar turnos</button>
  </div>

  <h2>Vista Diaria</h2>
  <table id="dailyTable">
    <thead>
      <tr>
        <th>Día</th>
        <th>Mañana</th>
        <th>Tarde</th>
        <th>Noche</th>
      </tr>
    </thead>
    <tbody>
      <!-- Se llenará dinámicamente -->
    </tbody>
  </table>

  <h2>Vista Mensual por Despachador</h2>
  <p>Pulsa sobre una casilla para bloquear o desbloquear un día. Los días bloqueados o asignados como domingo libre se resaltarán.</p>
  <table id="monthlyTable">
    <thead>
      <tr>
        <th>Despachador</th>
        <!-- Columnas para cada día del mes se generarán dinámicamente -->
      </tr>
    </thead>
    <tbody>
      <!-- Se llenará dinámicamente -->
    </tbody>
  </table>

  <script>
    /************************************************
     * CONFIGURACIÓN Y LISTA DE DESPACHADORES
     ************************************************/
    const DIAS_EN_MES = 30; // se usa un mes de 30 días para simplificar

    /*
      Las reglas de asignación se han adaptado para cumplir las siguientes condiciones:
        - Turno de mañana: siempre 5 despachadores.
        - Turno de tarde: como mínimo 3 despachadores.
        - Turno de noche: sólo 1 persona. Quien trabaja de noche debe tener 2 días libres antes
          y 3 días libres después de su turno de noche.
        - Cada despachador debe tener, al menos, un domingo libre al mes. Esto se gestiona
          asignando de forma automática un día domingo como bloqueado para cada persona si
          el usuario no lo ha hecho manualmente.
        - El usuario puede bloquear o desbloquear manualmente cualquier día de cualquier
          despachador desde la vista mensual. Los días bloqueados nunca serán asignados.
    */

    const dispatchers = [
      "Victor Millar solis",
      "Victor Gonzalez",
      "Sebastian Fernandez",
      "Ruth Millar",
      "René Asenjo",
      "Omar Millaguin",
      "Omar Bastidas",
      "Jonathan Molina",
      "Isabel Alvarado",
      "Esteban Gómez",
      "Daniela Vargas",
      "Claudio Cheuquian",
      "Claudio bustos",
      "Brayan Carrillo",
      "Emanuel Contreras",
      "Felipe G"
    ];

    // Asignaciones por día: { day, morning: [], afternoon: [], night: [] }
    let assignments = [];
    // Estado por despachador: offUntil, totalAssigned, nightCount
    let state = {};
    // Días bloqueados por despachador (incluye domingos libres y bloqueos manuales):
    // { "Nombre": Set<día> }
    let blockedDays = {};

    /************************************************
     * INICIALIZACIÓN
     ************************************************/
    function init() {
      // inicializar estructura de asignaciones
      assignments = [];
      for (let d = 1; d <= DIAS_EN_MES; d++) {
        assignments.push({
          day: d,
          morning: [],
          afternoon: [],
          night: []
        });
      }
      // inicializar estado de cada despachador
      state = {};
      dispatchers.forEach(disp => {
        state[disp] = {
          offUntil: 1,       // día a partir del cual puede trabajar (incluido)
          totalAssigned: 0,  // contador de turnos asignados (para equilibrio)
          nightCount: 0      // contador específico de turnos de noche
        };
      });
    }

    /************************************************
     * UTILIDADES PARA DOMINGOS LIBRES
     ************************************************/
    // Calcula los números de día que son domingo en el mes actual de DIAS_EN_MES días.
    // Se utiliza el mes y año actuales, aunque solo se consideran los primeros DIAS_EN_MES días.
    function computeSundays() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const sundays = [];
      for (let d = 1; d <= DIAS_EN_MES; d++) {
        const date = new Date(year, month, d);
        if (date.getDay() === 0) { // 0 = domingo
          sundays.push(d);
        }
      }
      return sundays;
    }

    // Asegura que cada despachador tenga al menos un día domingo bloqueado
    // como descanso. Si ya tiene algún domingo bloqueado manualmente o por
    // ejecución previa, no se modifica. Si no, se asigna el domingo rotando
    // entre los disponibles.
    function ensureSundayOff() {
      const sundays = computeSundays();
      dispatchers.forEach((disp, index) => {
        let hasSunday = false;
        if (blockedDays[disp]) {
          sundays.forEach(sunDay => {
            if (blockedDays[disp].has(sunDay)) hasSunday = true;
          });
        }
        if (!hasSunday && sundays.length > 0) {
          const assignedSunday = sundays[index % sundays.length];
          if (!blockedDays[disp]) blockedDays[disp] = new Set();
          blockedDays[disp].add(assignedSunday);
        }
      });
    }

    /************************************************
     * REGLAS DE VALIDACIÓN
     ************************************************/
    // Comprueba si un despachador puede trabajar de noche en el día indicado.
    // Debe cumplir:
    //   - No tener un día bloqueado (manual o domingo libre) ese día.
    //   - Su offUntil debe ser <= day.
    //   - Debió estar libre los dos días anteriores.
    function canWorkNight(disp, day) {
      if (state[disp].offUntil > day) return false;
      if (blockedDays[disp] && blockedDays[disp].has(day)) return false;
      // día anterior (d-1) y día dos antes (d-2) deben ser "off"
      if (day > 1) {
        const shiftYday1 = getShiftLetter(disp, day - 1);
        if (shiftYday1 !== 'off') return false;
      }
      if (day > 2) {
        const shiftYday2 = getShiftLetter(disp, day - 2);
        if (shiftYday2 !== 'off') return false;
      }
      return true;
    }

    // Comprueba si puede trabajar en la mañana
    function canWorkMorning(disp, day) {
      if (state[disp].offUntil > day) return false;
      if (blockedDays[disp] && blockedDays[disp].has(day)) return false;
      // si ya está asignado a noche, no puede
      if (assignments[day - 1].night.includes(disp)) return false;
      // regla de "vuelta corta": si ayer fue tarde o noche, no puede mañana hoy
      if (day > 1) {
          const yesterday = getShiftLetter(disp, day - 1);
          if (yesterday === 'T' || yesterday === 'N') return false;
      }
      return true;
    }

    // Comprueba si puede trabajar en la tarde
    function canWorkAfternoon(disp, day) {
      if (state[disp].offUntil > day) return false;
      if (blockedDays[disp] && blockedDays[disp].has(day)) return false;
      // si ya está asignado a noche o mañana, no puede
      if (assignments[day - 1].night.includes(disp)) return false;
      if (assignments[day - 1].morning.includes(disp)) return false;
      // si ayer fue noche, no puede tarde hoy
      if (day > 1) {
        const yesterday = getShiftLetter(disp, day - 1);
        if (yesterday === 'N') return false;
      }
      return true;
    }

    // Determina la letra del turno para un despachador en un día concreto
    function getShiftLetter(disp, day) {
      // day está indexado a partir de 1
      const dayObj = assignments[day - 1];
      if (dayObj.morning.includes(disp)) return 'M';
      if (dayObj.afternoon.includes(disp)) return 'T';
      if (dayObj.night.includes(disp)) return 'N';
      return 'off';
    }

    /************************************************
     * ASIGNACIÓN DE TURNOS
     ************************************************/
    // Asigna el turno de noche para el día indicado
    function assignNightShift(day) {
      // Obtener candidatos que pueden trabajar de noche
      let candidates = dispatchers.filter(disp => canWorkNight(disp, day));
      // ordenar por menor nightCount y luego por menor totalAssigned para repartir equitativamente
      candidates.sort((a, b) => {
        if (state[a].nightCount !== state[b].nightCount) {
          return state[a].nightCount - state[b].nightCount;
        }
        return state[a].totalAssigned - state[b].totalAssigned;
      });
      if (candidates.length > 0) {
        const chosen = candidates[0];
        assignments[day - 1].night.push(chosen);
        state[chosen].nightCount++;
        state[chosen].totalAssigned++;
        // Debe descansar 3 días después: su próximo día hábil es day+4
        const newOff = day + 4;
        if (state[chosen].offUntil < newOff) {
          state[chosen].offUntil = newOff;
        }
      }
    }

    // Asigna turnos de mañana para el día indicado
    function assignMorningShifts(day) {
      const neededMorning = 5;
      let candidates = dispatchers.filter(disp => canWorkMorning(disp, day));
      // ordenar por menor totalAssigned para equilibrar cargas
      candidates.sort((a, b) => state[a].totalAssigned - state[b].totalAssigned);
      for (let i = 0; i < neededMorning && candidates.length > 0; i++) {
        const chosen = candidates.shift();
        assignments[day - 1].morning.push(chosen);
        state[chosen].totalAssigned++;
      }
    }

    // Asigna turnos de tarde para el día indicado
    function assignAfternoonShifts(day) {
      const neededAfternoon = 3; // se podrían ajustar o aleatorizar si se desea más
      let candidates = dispatchers.filter(disp => canWorkAfternoon(disp, day));
      candidates.sort((a, b) => state[a].totalAssigned - state[b].totalAssigned);
      for (let i = 0; i < neededAfternoon && candidates.length > 0; i++) {
        const chosen = candidates.shift();
        assignments[day - 1].afternoon.push(chosen);
        state[chosen].totalAssigned++;
      }
    }

    // Genera el calendario del mes considerando las reglas y bloqueos
    function generateSchedule() {
      // resetear asignaciones y estado
      init();
      // asegurar domingo libre para cada uno (sin sobrescribir bloqueos existentes)
      ensureSundayOff();
      // recorrer día a día
      for (let d = 1; d <= DIAS_EN_MES; d++) {
        assignNightShift(d);
        assignMorningShifts(d);
        assignAfternoonShifts(d);
      }
    }

    /************************************************
     * ACTUALIZAR TABLAS (VISTA DIARIA Y VISTA MENSUAL)
     ************************************************/
    function actualizarVistaDiaria() {
      const tbody = document.getElementById('dailyTable').querySelector('tbody');
      tbody.innerHTML = '';
      for (let d = 1; d <= DIAS_EN_MES; d++) {
        const dayObj = assignments[d - 1];
        const row = document.createElement('tr');
        const cellDay = document.createElement('td');
        cellDay.textContent = 'Día ' + d;
        row.appendChild(cellDay);
        const cellM = document.createElement('td');
        cellM.textContent = dayObj.morning.join(', ');
        row.appendChild(cellM);
        const cellT = document.createElement('td');
        cellT.textContent = dayObj.afternoon.join(', ');
        row.appendChild(cellT);
        const cellN = document.createElement('td');
        cellN.textContent = dayObj.night.join(', ');
        row.appendChild(cellN);
        tbody.appendChild(row);
      }
    }

    function actualizarVistaMensual() {
      const monthlyTable = document.getElementById('monthlyTable');
      const theadRow = monthlyTable.querySelector('thead tr');
      theadRow.innerHTML = '<th>Despachador</th>';
      for (let d = 1; d <= DIAS_EN_MES; d++) {
        const th = document.createElement('th');
        th.textContent = d;
        theadRow.appendChild(th);
      }
      const tbody = monthlyTable.querySelector('tbody');
      tbody.innerHTML = '';
      dispatchers.forEach(disp => {
        const row = document.createElement('tr');
        const cellName = document.createElement('td');
        cellName.textContent = disp;
        row.appendChild(cellName);
        for (let d = 1; d <= DIAS_EN_MES; d++) {
          const dayObj = assignments[d - 1];
          const cell = document.createElement('td');
          let letter = 'off';
          if (dayObj.morning.includes(disp)) letter = 'M';
          else if (dayObj.afternoon.includes(disp)) letter = 'T';
          else if (dayObj.night.includes(disp)) letter = 'N';
          // aplicar clases según estado
          if (blockedDays[disp] && blockedDays[disp].has(d)) {
            cell.classList.add('blocked');
          } else if (letter === 'off') {
            cell.classList.add('off');
          }
          cell.textContent = letter;
          // atributos data para identificar despachador y día
          cell.dataset.disp = disp;
          cell.dataset.day = d;
          // escuchar clic para bloquear/desbloquear
          cell.addEventListener('click', function(e) {
            const dname = e.target.dataset.disp;
            const dayNum = parseInt(e.target.dataset.day, 10);
            toggleBlock(dname, dayNum);
          });
          row.appendChild(cell);
        }
        tbody.appendChild(row);
      });
    }

    /************************************************
     * BLOQUEO/DEBLOQUEO MANUAL DE DÍAS
     ************************************************/
    function toggleBlock(disp, day) {
      if (!blockedDays[disp]) blockedDays[disp] = new Set();
      if (blockedDays[disp].has(day)) {
        blockedDays[disp].delete(day);
      } else {
        blockedDays[disp].add(day);
      }
      // Después de modificar bloqueos regeneramos el calendario
      generarTurnos();
    }

    /************************************************
     * PROCESO PRINCIPAL
     ************************************************/
    function generarTurnos() {
      generateSchedule();
      actualizarVistaDiaria();
      actualizarVistaMensual();
    }

    // Inicializamos y mostramos vacío al cargar la página
    init();
    // Aseguramos domingo libre de inicio
    ensureSundayOff();
    actualizarVistaDiaria();
    actualizarVistaMensual();
  </script>
</body>
</html>
