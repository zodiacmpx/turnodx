<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Turnos</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #000;
      padding: 8px;
      text-align: left;
    }
    select, input {
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Calendario de Turnos</h1>
  <table id="calendar">
    <thead>
      <tr>
        <th>Día</th>
        <th>Mañana</th>
        <th>Tarde</th>
        <th>Noche</th>
      </tr>
    </thead>
    <tbody>
      <!-- Generar filas para cada día del mes -->
      <!-- Ejemplo para día 1 -->
      <tr>
        <td>Día 1</td>
        <td>
          <select>
            <option value="">----</option>
            <!-- Agregar opciones de despachadores aquí -->
          </select>
          <input type="checkbox" name="bloquear"> Bloquear
        </td>
        <td>
          <select>
            <option value="">----</option>
            <!-- Agregar opciones de despachadores aquí -->
          </select>
          <input type="checkbox" name="bloquear"> Bloquear
        </td>
        <td>
          <select>
            <option value="">----</option>
            <!-- Agregar opciones de despachadores aquí -->
          </select>
          <input type="checkbox" name="bloquear"> Bloquear
        </td>
      </tr>
      <!-- Repetir para días 2 a 30 -->
    </tbody>
  </table>
  <button onclick="generarTurnos()">Generar turnos</button>

  <script>
    function generarTurnos() {
      // Obtener la tabla
      const table = document.getElementById('calendar').getElementsByTagName('tbody')[0];
      const rows = table.getElementsByTagName('tr');

      // Listas de despachadores disponibles
      const despachadores = [];
      for (let i = 1; i <= 23; i++) {
        despachadores.push(`Despachador${i}`);
      }

      // Array para trackear la disponibilidad de cada despachador
      const disponibilidad = {};
      despachadores.forEach(desp => {
        disponibilidad[desp] = Array(30).fill(true); // Suponiendo 30 días
      });

      // Primero, identificar asignaciones bloqueadas y actualizar disponibilidad
      for (let i = 0; i < rows.length; i++) {
        const day = i + 1;
        const cells = rows[i].getElementsByTagName('td');
        for (let j = 0; j < cells.length; j++) {
          const select = cells[j].getElementsByTagName('select')[0];
          const bloquear = cells[j].getElementsByTagName('input')[0];
          if (bloquear.checked) {
            const selectedDesp = select.value;
            if (selectedDesp !== '') {
              // Marcar este despachador como no disponible para este día y turno
              disponibilidad[selectedDesp][day - 1] = false;
            }
          }
        }
      }

      // Ahora, asignar turnos de noche
      for (let i = 0; i < rows.length; i++) {
        const day = i + 1;
        const nocheCell = rows[i].getElementsByTagName('td')[3]; // Índice 3 para turno de noche
        const selectNoche = nocheCell.getElementsByTagName('select')[0];
        const bloquearNoche = nocheCell.getElementsByTagName('input')[0];

        if (!bloquearNoche.checked && selectNoche.value === '') {
          // Asignar despachador para este turno de noche
          for (let d = 0; d < despachadores.length; d++) {
            const desp = despachadores[d];
            if (disponibilidad[desp][day - 1] && disponibilidad[desp][day - 2] && disponibilidad[desp][day + 3] && disponibilidad[desp][day + 4]) {
              // Asignar este despachador para 4 noches seguidas
              selectNoche.value = desp;
              // Marcar los días correspondientes como no disponibles
              for (let k = 0; k < 4; k++) {
                disponibilidad[desp][day - 1 + k] = false;
              }
              // Marcar día antes y dos días después como no disponibles
              disponibilidad[desp][day - 2] = false;
              disponibilidad[desp][day + 3] = false;
              disponibilidad[desp][day + 4] = false;
              break; // Salir del loop de despachadores una vez asignado
            }
          }
        }
      }

      // Luego, asignar turnos de día y tarde
      for (let i = 0; i < rows.length; i++) {
        const day = i + 1;
        const mañanaCell = rows[i].getElementsByTagName('td')[1]; // Índice 1 para turno de mañana
        const tardeCell = rows[i].getElementsByTagName('td')[2]; // Índice 2 para turno de tarde
        const selectMañana = mañanaCell.getElementsByTagName('select')[0];
        const selectTarde = tardeCell.getElementsByTagName('select')[0];
        const bloquearMañana = mañanaCell.getElementsByTagName('input')[0];
        const bloquearTarde = tardeCell.getElementsByTagName('input')[0];

        if (!bloquearMañana.checked && selectMañana.value === '') {
          // Asignar despachadores para turno de mañana
          let count = 0;
          for (let d = 0; d < despachadores.length; d++) {
            const desp = despachadores[d];
            if (disponibilidad[desp][day - 1]) {
              selectMañana.appendChild(createOption(desp, desp));
              count++;
              if (count >= 5) break; // Asignar 5 despachadores
            }
          }
        }

        if (!bloquearTarde.checked && selectTarde.value === '') {
          // Asignar despachadores para turno de tarde
          let count = 0;
          for (let d = 0; d < despachadores.length; d++) {
            const desp = despachadores[d];
            if (disponibilidad[desp][day - 1]) {
              selectTarde.appendChild(createOption(desp, desp));
              count++;
              if (count >= 4) break; // Asignar 4 despachadores
            }
          }
        }
      }
    }

    function createOption(value, text) {
      const option = document.createElement('option');
      option.value = value;
      option.text = text;
      return option;
    }
  </script>
</body>
</html>
