<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Turnos Mejorado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      border-collapse: collapse;
      margin-bottom: 20px;
      width: 100%;
    }
    th, td {
      border: 1px solid #000;
      padding: 5px;
      text-align: center;
      font-size: 12px;
    }
    .controls {
      margin-bottom: 20px;
    }
    h2 {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>Calendario de Turnos Mejorado</h1>
  <div class="controls">
    <button onclick="generarTurnos()">Generar turnos</button>
  </div>

  <h2>Vista Diaria</h2>
  <table id="dailyTable">
    <thead>
      <tr>
        <th>Día</th>
        <th>Mañana</th>
        <th>Tarde</th>
        <th>Noche</th>
      </tr>
    </thead>
    <tbody>
      <!-- Se llenará dinámicamente -->
    </tbody>
  </table>

  <h2>Vista Mensual por Despachador</h2>
  <table id="monthlyTable">
    <thead>
      <tr>
        <th>Despachador</th>
        <!-- Columnas para cada día del mes se generarán dinámicamente -->
      </tr>
    </thead>
    <tbody>
      <!-- Se llenará dinámicamente -->
    </tbody>
  </table>

  <script>
    /* CONFIGURACIÓN */
    const DIAS_EN_MES = 30;
    // Los turnos diarios se asignarán de forma aleatoria dentro de estos rangos:
    // Mañana: 5 o 6, Tarde: 3 o 4, Noche: 1.

    /* LISTA DE DESPACHADORES */
    const dispatchers = [
      "Victor Millar solis",
      "Victor Gonzalez",
      "Sebastian Fernandez",
      "Ruth Millar",
      "René Asenjo",
      "Omar Millaguin",
      "Omar Bastidas",
      "Jonathan Molina",
      "Isabel Alvarado",
      "Esteban Gómez",
      "Daniela Vargas",
      "Claudio Cheuquian",
      "Claudio bustos",
      "Brayan Carrillo",
      "Emanuel Contreras",
      "Felipe G"
    ];

    /* VARIABLES GLOBALES */
    let dispatcherState = {};    // Estado de cada despachador: { lastShift, consecutiveDays, offUntil }
    let dispatcherSchedule = {}; // Para cada despachador, un array de 1..DIAS_EN_MES con el turno asignado: "M", "T", "N" o "off"
    let dailySchedule = [];      // Array de días: cada elemento es { morning:[], afternoon:[], night:[] }

    /* FUNCIONES DE INICIALIZACIÓN */
    function inicializarDespachadores() {
      dispatcherState = {};
      dispatcherSchedule = {};
      dispatchers.forEach(disp => {
        dispatcherState[disp] = {
          lastShift: "off",     // "manana", "tarde", "noche" o "off"
          consecutiveDays: 0,   // Días consecutivos trabajando el mismo turno
          offUntil: 1           // Día a partir del cual está disponible (1-indexado)
        };
        // Creamos un array (índices 1..DIAS_EN_MES) inicializado en "off"
        dispatcherSchedule[disp] = Array(DIAS_EN_MES + 1).fill("off");
      });
      // Inicializamos la vista diaria
      dailySchedule = Array(DIAS_EN_MES).fill(null).map(() => ({ morning: [], afternoon: [], night: [] }));
    }

    /* AYUDANTES PARA LAS RESTRICCIONES */
    // Devuelve true si el despachador está disponible el día d (1-indexado) según su estado forzado (descanso)
    function isAvailable(dispatcher, d) {
      return d >= dispatcherState[dispatcher].offUntil;
    }

    // Verifica si el despachador puede ser asignado al turno 'shift' en el día d según las restricciones del día anterior.
    // shift: "manana", "tarde" o "noche"
    function allowedForShift(dispatcher, shift, d) {
      if (d === 1) return true; // No hay restricciones de día anterior
      let prev = dispatcherSchedule[dispatcher][d - 1]; // turno del día anterior ("M", "T", "N" o "off")
      if (shift === "manana") {
        // Si ayer trabajó en Tarde ("T") o Noche ("N"), no se permite mañana.
        if (prev === "T" || prev === "N") return false;
      } else if (shift === "tarde") {
        // Si ayer trabajó Noche ("N"), no se permite Tarde.
        if (prev === "N") return false;
      } else if (shift === "noche") {
        // Para turno de noche se requiere haber descansado el día anterior.
        if (prev !== "off") return false;
      }
      return true;
    }

    // Mapea el nombre completo del turno a una abreviatura para la visualización.
    function shiftLetter(shift) {
      if (shift === "manana") return "M";
      if (shift === "tarde") return "T";
      if (shift === "noche") return "N";
      return "";
    }

    // Actualiza el estado del despachador luego de asignarle un turno en el día d.
    function updateState(dispatcher, shift, d) {
      let letter = shiftLetter(shift);
      // Si el turno de ayer es igual al actual, aumenta el conteo; de lo contrario, se reinicia.
      let prev = (d > 1) ? dispatcherSchedule[dispatcher][d - 1] : "off";
      if (prev === letter) {
        dispatcherState[dispatcher].consecutiveDays++;
      } else {
        dispatcherState[dispatcher].consecutiveDays = 1;
      }
      dispatcherState[dispatcher].lastShift = shift;
      dispatcherSchedule[dispatcher][d] = letter;

      // Si alcanza 4 días consecutivos, se asignan 2 días de descanso.
      if (dispatcherState[dispatcher].consecutiveDays === 4) {
        dispatcherState[dispatcher].offUntil = d + 3; // Descanso en los 2 días siguientes; disponible a partir del día d+3.
      }
    }

    // Si el despachador no es asignado en el día d, se marca como "off" y se reinicia la continuidad.
    function markOff(dispatcher, d) {
      dispatcherSchedule[dispatcher][d] = "off";
      dispatcherState[dispatcher].consecutiveDays = 0;
      dispatcherState[dispatcher].lastShift = "off";
    }

    /* ALGORITMO DE ASIGNACIÓN */
    function generarTurnos() {
      inicializarDespachadores();

      // Se recorre cada día del mes (d de 1 a DIAS_EN_MES)
      for (let d = 1; d <= DIAS_EN_MES; d++) {
        // Se definen las cantidades requeridas para el día:
        let reqManana = Math.random() < 0.5 ? 5 : 6;
        let reqTarde = Math.random() < 0.5 ? 3 : 4;
        let reqNoche = 1;

        // Conjunto para saber quién ya fue asignado en el día d.
        let assignedToday = new Set();

        // --- PRIMER PASO: ASIGNACIÓN POR CONTINUIDAD ---
        // Si un despachador ya tiene turno asignado el día anterior (diferente de "off")
        // se intenta asignarle el mismo turno hoy, siempre que cumpla las restricciones.
        dispatchers.forEach(disp => {
          if (assignedToday.has(disp)) return;
          if (!isAvailable(disp, d)) return;
          let pref = dispatcherState[disp].lastShift; // Puede ser "manana", "tarde", "noche" o "off"
          if (pref !== "off" && allowedForShift(disp, pref, d)) {
            if (pref === "manana" && reqManana > 0) {
              dailySchedule[d - 1].morning.push(disp);
              assignedToday.add(disp);
              updateState(disp, "manana", d);
              reqManana--;
            } else if (pref === "tarde" && reqTarde > 0) {
              dailySchedule[d - 1].afternoon.push(disp);
              assignedToday.add(disp);
              updateState(disp, "tarde", d);
              reqTarde--;
            } else if (pref === "noche" && reqNoche > 0) {
              dailySchedule[d - 1].night.push(disp);
              assignedToday.add(disp);
              updateState(disp, "noche", d);
              reqNoche--;
            }
          }
        });

        // --- SEGUNDO PASO: COMPLETAR LOS TURNOS QUE QUEDEN VACANTES ---
        // Función interna para llenar un turno (mañana, tarde o noche)
        function fillShift(shiftType, requiredCount) {
          while (requiredCount > 0) {
            // Se filtran candidatos disponibles que no hayan sido asignados hoy y que cumplan la restricción.
            let candidates = dispatchers.filter(disp => {
              return !assignedToday.has(disp) && isAvailable(disp, d) && allowedForShift(disp, shiftType, d);
            });
            if (candidates.length === 0) break;
            // Se ordenan los candidatos por la cantidad de días consecutivos (se prefiere reiniciar la secuencia para balancear)
            candidates.sort((a, b) => dispatcherState[a].consecutiveDays - dispatcherState[b].consecutiveDays);
            let chosen = candidates[0];
            if (shiftType === "manana") {
              dailySchedule[d - 1].morning.push(chosen);
            } else if (shiftType === "tarde") {
              dailySchedule[d - 1].afternoon.push(chosen);
            } else if (shiftType === "noche") {
              dailySchedule[d - 1].night.push(chosen);
            }
            assignedToday.add(chosen);
            updateState(chosen, shiftType, d);
            requiredCount--;
          }
        }

        fillShift("manana", reqManana);
        fillShift("tarde", reqTarde);
        fillShift("noche", reqNoche);

        // --- TERCER PASO: LOS NO ASIGNADOS QUEDAN EN DESCANSO ---
        dispatchers.forEach(disp => {
          if (!assignedToday.has(disp)) {
            markOff(disp, d);
          }
        });
      }

      // Una vez generada la asignación, se actualizan las vistas.
      actualizarVistaDiaria();
      actualizarVistaMensual();
    }

    /* VISUALIZACIONES */
    // Actualiza la vista diaria (tabla con día y los despachadores asignados a cada turno)
    function actualizarVistaDiaria() {
      const tbody = document.getElementById("dailyTable").querySelector("tbody");
      tbody.innerHTML = "";
      for (let d = 1; d <= DIAS_EN_MES; d++) {
        const row = document.createElement("tr");
        const cellDay = document.createElement("td");
        cellDay.textContent = "Día " + d;
        row.appendChild(cellDay);

        const cellManana = document.createElement("td");
        cellManana.textContent = dailySchedule[d - 1].morning.join(", ");
        row.appendChild(cellManana);

        const cellTarde = document.createElement("td");
        cellTarde.textContent = dailySchedule[d - 1].afternoon.join(", ");
        row.appendChild(cellTarde);

        const cellNoche = document.createElement("td");
        cellNoche.textContent = dailySchedule[d - 1].night.join(", ");
        row.appendChild(cellNoche);

        tbody.appendChild(row);
      }
    }

    // Actualiza la vista mensual por despachador (tabla donde cada fila es un despachador y cada columna un día)
    function actualizarVistaMensual() {
      const monthlyTable = document.getElementById("monthlyTable");
      const theadRow = monthlyTable.querySelector("thead tr");
      theadRow.innerHTML = "<th>Despachador</th>";
      for (let d = 1; d <= DIAS_EN_MES; d++) {
        const th = document.createElement("th");
        th.textContent = d;
        theadRow.appendChild(th);
      }

      const tbody = monthlyTable.querySelector("tbody");
      tbody.innerHTML = "";
      dispatchers.forEach(disp => {
        const row = document.createElement("tr");
        const cellName = document.createElement("td");
        cellName.textContent = disp;
        row.appendChild(cellName);
        for (let d = 1; d <= DIAS_EN_MES; d++) {
          const cell = document.createElement("td");
          cell.textContent = dispatcherSchedule[disp][d]; // "M", "T", "N" o "off"
          row.appendChild(cell);
        }
        tbody.appendChild(row);
      });
    }

    // Inicialización: se crean los despachadores y se muestra el estado inicial (todo off)
    inicializarDespachadores();
    actualizarVistaDiaria();
    actualizarVistaMensual();
  </script>
</body>
</html>
