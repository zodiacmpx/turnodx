<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Turnos - Versión Mejorada</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #000;
      padding: 8px;
      text-align: center;
    }
    select {
      width: 100%;
      padding: 4px;
    }
    button {
      margin-right: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .controls {
      margin-bottom: 20px;
    }
    .estadisticas {
      margin-top: 20px;
    }
    .estadisticas h2 {
      margin-bottom: 10px;
    }
    .estadisticas table {
      width: 50%;
      margin: 0 auto;
    }
    .chart {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
    .bar {
      background-color: #4CAF50;
      margin: 2px;
      text-align: center;
      color: white;
      padding: 5px;
      width: 30px;
    }
  </style>
</head>
<body>
  <h1>Calendario de Turnos</h1>
  <div class="controls">
    <button onclick="generarTurnos()">Generar turnos</button>
    <button onclick="guardarCambios()">Guardar cambios</button>
    <button onclick="reiniciarCalendario()">Reiniciar calendario</button>
  </div>
  <table id="calendar">
    <thead>
      <tr>
        <th>Día</th>
        <th>Mañana (5)</th>
        <th>Tarde (4)</th>
        <th>Noche (1)</th>
      </tr>
    </thead>
    <tbody>
      <!-- Filas se generarán dinámicamente -->
    </tbody>
  </table>

  <div class="estadisticas">
    <h2>Estadísticas</h2>
    <table id="statsTable">
      <thead>
        <tr>
          <th>Despachador</th>
          <th>Total Días Trabajados</th>
          <th>Mañanas</th>
          <th>Tardes</th>
          <th>Noches</th>
        </tr>
      </thead>
      <tbody>
        <!-- Datos de estadísticas se generarán aquí -->
      </tbody>
    </table>
    <div class="chart" id="chartContainer"></div>
  </div>

  <script>
    // CONFIGURACIÓN:
    const NUM_DESPACHADORES = 23; // Si deseas que cada uno llegue a trabajar ~20 días, considera reducir este número.
    const DIAS_EN_MES = 30;
    const TURNOS_MANANA = 5;
    const TURNOS_TARDE = 4;
    const TURNOS_NOCHE = 1; // Siempre 1

    let despachadores = [];
    let disponibilidad = {};
    let calendario = [];
    // Contador de días trabajados por cada despachador
    let diasTrabajados = {};
    // Para llevar cuenta de turnos por tipo
    let turnosPorTipo = {};

    // Inicializar despachadores, disponibilidad y contadores
    function inicializarDespachadores() {
      despachadores = [];
      disponibilidad = {};
      diasTrabajados = {};
      turnosPorTipo = {};
      for (let i = 1; i <= NUM_DESPACHADORES; i++) {
        const nombre = `Despachador${i}`;
        despachadores.push(nombre);
        // Creamos un arreglo de 30 días (true = disponible)
        disponibilidad[nombre] = Array(DIAS_EN_MES).fill(true);
        diasTrabajados[nombre] = 0;
        turnosPorTipo[nombre] = { manana: 0, tarde: 0, noche: 0 };
      }
    }

    // Crear la estructura del calendario
    function crearCalendario() {
      const tbody = document.querySelector('#calendar tbody');
      tbody.innerHTML = '';
      calendario = [];
      for (let dia = 1; dia <= DIAS_EN_MES; dia++) {
        const row = document.createElement('tr');
        const cellDia = document.createElement('td');
        cellDia.textContent = `Día ${dia}`;
        row.appendChild(cellDia);

        // Turno mañana
        const cellManana = document.createElement('td');
        const selectManana = document.createElement('select');
        selectManana.setAttribute('data-dia', dia);
        selectManana.setAttribute('data-turno', 'manana');
        cellManana.appendChild(selectManana);
        row.appendChild(cellManana);

        // Turno tarde
        const cellTarde = document.createElement('td');
        const selectTarde = document.createElement('select');
        selectTarde.setAttribute('data-dia', dia);
        selectTarde.setAttribute('data-turno', 'tarde');
        cellTarde.appendChild(selectTarde);
        row.appendChild(cellTarde);

        // Turno noche
        const cellNoche = document.createElement('td');
        const selectNoche = document.createElement('select');
        selectNoche.setAttribute('data-dia', dia);
        selectNoche.setAttribute('data-turno', 'noche');
        cellNoche.appendChild(selectNoche);
        row.appendChild(cellNoche);

        tbody.appendChild(row);

        // Guardar referencias en el calendario
        calendario.push({
          dia,
          manana: selectManana,
          tarde: selectTarde,
          noche: selectNoche
        });
      }
    }

    // Función para asignar turnos (mañana o tarde) de forma balanceada
    function asignarTurno(select, numDespachadores, dia, turnoTipo) {
      select.innerHTML = ''; // Limpiar opciones previas
      // Filtrar despachadores disponibles en el día
      let disponibles = despachadores.filter(desp => disponibilidad[desp][dia - 1]);
      // Ordenar de menor a mayor según los días trabajados
      disponibles.sort((a, b) => diasTrabajados[a] - diasTrabajados[b]);

      for (let i = 0; i < numDespachadores && i < disponibles.length; i++) {
        const desp = disponibles[i];
        const option = document.createElement('option');
        option.value = desp;
        option.textContent = desp;
        select.appendChild(option);
        // Marcar que el despachador ya trabajó este día
        disponibilidad[desp][dia - 1] = false;
        diasTrabajados[desp]++;
        turnosPorTipo[desp][turnoTipo]++;
      }
    }

    // Función para asignar el turno de noche con restricciones adicionales
    function asignarTurnoNoche(select, dia) {
      select.innerHTML = '';
      // Para el turno de noche se exige que además estén disponibles el día anterior y los 4 días siguientes
      let disponibles = despachadores.filter(desp => {
         const idx = dia - 1; // Índice del día actual
         const condActual = disponibilidad[desp][idx];
         const condAntes = (idx - 1 >= 0) ? disponibilidad[desp][idx - 1] : true;
         const condDespues1 = (idx + 1 < DIAS_EN_MES) ? disponibilidad[desp][idx + 1] : true;
         const condDespues2 = (idx + 2 < DIAS_EN_MES) ? disponibilidad[desp][idx + 2] : true;
         const condDespues3 = (idx + 3 < DIAS_EN_MES) ? disponibilidad[desp][idx + 3] : true;
         const condDespues4 = (idx + 4 < DIAS_EN_MES) ? disponibilidad[desp][idx + 4] : true;
         return condActual && condAntes && condDespues1 && condDespues2 && condDespues3 && condDespues4;
      });
      // Ordenamos por días trabajados
      disponibles.sort((a, b) => diasTrabajados[a] - diasTrabajados[b]);
      if (disponibles.length > 0) {
         const desp = disponibles[0];
         const option = document.createElement('option');
         option.value = desp;
         option.textContent = desp;
         select.appendChild(option);
         // Definir los índices a bloquear (se bloquea el día anterior, el actual y los 4 días siguientes)
         const indicesABloquear = [];
         const idx = dia - 1;
         if (idx - 1 >= 0) indicesABloquear.push(idx - 1);  // día anterior
         indicesABloquear.push(idx);                         // día actual
         if (idx + 1 < DIAS_EN_MES) indicesABloquear.push(idx + 1);
         if (idx + 2 < DIAS_EN_MES) indicesABloquear.push(idx + 2);
         if (idx + 3 < DIAS_EN_MES) indicesABloquear.push(idx + 3);
         if (idx + 4 < DIAS_EN_MES) indicesABloquear.push(idx + 4);
         indicesABloquear.forEach(i => {
             disponibilidad[desp][i] = false;
         });
         diasTrabajados[desp]++;
         turnosPorTipo[desp].noche++;
      }
    }

    // Generar turnos: primero los de noche (por restricciones) y luego los de mañana y tarde
    function generarTurnos() {
      // Reiniciar contadores y disponibilidad
      inicializarDespachadores();
      crearCalendario();

      // Asignar turno de noche para cada día
      calendario.forEach(({ dia, noche }) => {
        asignarTurnoNoche(noche, dia);
      });
      // Asignar turnos de mañana y tarde para cada día
      calendario.forEach(({ dia, manana, tarde }) => {
        asignarTurno(manana, TURNOS_MANANA, dia, 'manana');
        asignarTurno(tarde, TURNOS_TARDE, dia, 'tarde');
      });

      actualizarEstadisticas();
    }

    // Actualizar estadísticas y gráfico
    function actualizarEstadisticas() {
      const stats = {};
      despachadores.forEach(desp => {
        stats[desp] = {
          total: diasTrabajados[desp],
          manana: turnosPorTipo[desp].manana,
          tarde: turnosPorTipo[desp].tarde,
          noche: turnosPorTipo[desp].noche
        };
      });

      const statsTableBody = document.querySelector('#statsTable tbody');
      statsTableBody.innerHTML = '';
      Object.entries(stats).forEach(([desp, data]) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${desp}</td>
          <td>${data.total}</td>
          <td>${data.manana}</td>
          <td>${data.tarde}</td>
          <td>${data.noche}</td>
        `;
        statsTableBody.appendChild(row);
      });

      generarGraficoBarras(stats);
    }

    // Generar gráfico de barras según los días trabajados
    function generarGraficoBarras(stats) {
      const chartContainer = document.getElementById('chartContainer');
      chartContainer.innerHTML = '';
      Object.entries(stats).forEach(([desp, data]) => {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = `${data.total * 10}px`;
        bar.textContent = data.total;
        chartContainer.appendChild(bar);
      });
    }

    // Guardar cambios manuales (simulación)
    function guardarCambios() {
      alert('Cambios guardados.');
      actualizarEstadisticas();
    }

    // Reiniciar calendario
    function reiniciarCalendario() {
      crearCalendario();
      alert('Calendario reiniciado.');
      actualizarEstadisticas();
    }

    // Inicialización al cargar la página
    inicializarDespachadores();
    crearCalendario();
    actualizarEstadisticas();
  </script>
</body>
</html>
