<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Turnos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #000;
      padding: 8px;
      text-align: center;
    }
    select {
      width: 100%;
      padding: 4px;
    }
    button {
      margin-right: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .controls {
      margin-bottom: 20px;
    }
    .estadisticas {
      margin-top: 20px;
    }
    .estadisticas h2 {
      margin-bottom: 10px;
    }
    .estadisticas table {
      width: 50%;
      margin: 0 auto;
    }
    .chart {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
    .bar {
      background-color: #4CAF50;
      margin: 2px;
      text-align: center;
      color: white;
      padding: 5px;
      width: 30px;
    }
  </style>
</head>
<body>
  <h1>Calendario de Turnos</h1>
  <div class="controls">
    <button onclick="generarTurnos()">Generar turnos</button>
    <button onclick="guardarCambios()">Guardar cambios</button>
    <button onclick="reiniciarCalendario()">Reiniciar calendario</button>
  </div>
  <table id="calendar">
    <thead>
      <tr>
        <th>Día</th>
        <th>Mañana (5)</th>
        <th>Tarde (4)</th>
        <th>Noche (1)</th>
      </tr>
    </thead>
    <tbody>
      <!-- Filas se generarán dinámicamente -->
    </tbody>
  </table>

  <div class="estadisticas">
    <h2>Estadísticas</h2>
    <table id="statsTable">
      <thead>
        <tr>
          <th>Despachador</th>
          <th>Total Días Trabajados</th>
          <th>Mañanas</th>
          <th>Tardes</th>
          <th>Noches</th>
        </tr>
      </thead>
      <tbody>
        <!-- Datos de estadísticas se generarán aquí -->
      </tbody>
    </table>
    <div class="chart" id="chartContainer"></div>
  </div>

  <script>
    const NUM_DESPACHADORES = 23;
    const DIAS_EN_MES = 30;
    const TURNOS_MANANA = 5;
    const TURNOS_TARDE = 4;
    const TURNOS_NOCHE = 1;

    let despachadores = [];
    let disponibilidad = {};
    let calendario = [];

    // Inicializar despachadores y disponibilidad
    function inicializarDespachadores() {
      despachadores = [];
      for (let i = 1; i <= NUM_DESPACHADORES; i++) {
        despachadores.push(`Despachador${i}`);
      }
      disponibilidad = {};
      despachadores.forEach(desp => {
        disponibilidad[desp] = Array(DIAS_EN_MES).fill(true);
      });
    }

    // Crear la estructura del calendario
    function crearCalendario() {
      const tbody = document.querySelector('#calendar tbody');
      tbody.innerHTML = '';
      calendario = [];
      for (let dia = 1; dia <= DIAS_EN_MES; dia++) {
        const row = document.createElement('tr');
        const cellDia = document.createElement('td');
        cellDia.textContent = `Día ${dia}`;
        row.appendChild(cellDia);

        // Turno mañana
        const cellManana = document.createElement('td');
        const selectManana = document.createElement('select');
        selectManana.setAttribute('data-dia', dia);
        selectManana.setAttribute('data-turno', 'manana');
        cellManana.appendChild(selectManana);
        row.appendChild(cellManana);

        // Turno tarde
        const cellTarde = document.createElement('td');
        const selectTarde = document.createElement('select');
        selectTarde.setAttribute('data-dia', dia);
        selectTarde.setAttribute('data-turno', 'tarde');
        cellTarde.appendChild(selectTarde);
        row.appendChild(cellTarde);

        // Turno noche
        const cellNoche = document.createElement('td');
        const selectNoche = document.createElement('select');
        selectNoche.setAttribute('data-dia', dia);
        selectNoche.setAttribute('data-turno', 'noche');
        cellNoche.appendChild(selectNoche);
        row.appendChild(cellNoche);

        tbody.appendChild(row);

        // Guardar referencias en el calendario
        calendario.push({
          dia,
          manana: selectManana,
          tarde: selectTarde,
          noche: selectNoche
        });
      }
    }

    // Asignar despachadores automáticamente
    function generarTurnos() {
      inicializarDespachadores();
      let cuotas = {};
      despachadores.forEach(desp => {
        cuotas[desp] = 20; // Cada despachador debe trabajar 20 días
      });

      // Priorizar turnos de noche
      for (let dia = 1; dia <= DIAS_EN_MES; dia += 4) {
        asignarTurnoNoche(calendario[dia - 1].noche, dia, cuotas);
      }

      // Asignar turnos de mañana y tarde
      calendario.forEach(({ dia, manana, tarde }) => {
        asignarTurno(manana, TURNOS_MANANA, dia, cuotas);
        asignarTurno(tarde, TURNOS_TARDE, dia, cuotas);
      });

      actualizarEstadisticas();
    }

    // Asignar turnos generales (mañana o tarde)
    function asignarTurno(select, numDespachadores, dia, cuotas) {
      select.innerHTML = ''; // Limpiar opciones previas
      const disponibles = despachadores.filter(desp => disponibilidad[desp][dia - 1] && cuotas[desp] > 0);

      for (let i = 0; i < numDespachadores; i++) {
        if (disponibles.length === 0) break; // No hay más despachadores disponibles
        const indice = i % disponibles.length;
        const desp = disponibles[indice];
        if (disponibilidad[desp][dia - 1] && cuotas[desp] > 0) {
          const option = document.createElement('option');
          option.value = desp;
          option.textContent = desp;
          select.appendChild(option);
          disponibilidad[desp][dia - 1] = false;
          cuotas[desp]--;
        }
      }
    }

    // Asignar turno de noche
    function asignarTurnoNoche(select, dia, cuotas) {
      select.innerHTML = ''; // Limpiar opciones previas
      const disponibles = despachadores.filter(desp =>
        disponibilidad[desp][dia - 1] &&
        disponibilidad[desp][dia - 2] && // Día de descanso antes
        disponibilidad[desp][dia + 3] && // Día de descanso después
        disponibilidad[desp][dia + 4] &&
        cuotas[desp] >= 4 // Debe tener cuota suficiente para 4 noches
      );

      if (disponibles.length > 0) {
        const desp = disponibles[0]; // Tomar el primer disponible
        const option = document.createElement('option');
        option.value = desp;
        option.textContent = desp;
        select.appendChild(option);

        // Marcar días como no disponibles
        for (let k = 0; k < 4; k++) {
          disponibilidad[desp][dia - 1 + k] = false;
          cuotas[desp]--;
        }
        disponibilidad[desp][dia - 2] = false;
        disponibilidad[desp][dia + 3] = false;
        disponibilidad[desp][dia + 4] = false;
      }
    }

    // Actualizar estadísticas
    function actualizarEstadisticas() {
      const stats = {};
      despachadores.forEach(desp => {
        stats[desp] = { total: 0, manana: 0, tarde: 0, noche: 0 };
      });

      calendario.forEach(({ manana, tarde, noche }, index) => {
        Array.from(manana.selectedOptions).forEach(option => {
          stats[option.value].total++;
          stats[option.value].manana++;
        });
        Array.from(tarde.selectedOptions).forEach(option => {
          stats[option.value].total++;
          stats[option.value].tarde++;
        });
        Array.from(noche.selectedOptions).forEach(option => {
          stats[option.value].total++;
          stats[option.value].noche++;
        });
      });

      const statsTableBody = document.querySelector('#statsTable tbody');
      statsTableBody.innerHTML = '';
      Object.entries(stats).forEach(([desp, data]) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${desp}</td>
          <td>${data.total}</td>
          <td>${data.manana}</td>
          <td>${data.tarde}</td>
          <td>${data.noche}</td>
        `;
        statsTableBody.appendChild(row);
      });

      // Generar gráfico de barras
      generarGraficoBarras(stats);
    }

    // Generar gráfico de barras
    function generarGraficoBarras(stats) {
      const chartContainer = document.getElementById('chartContainer');
      chartContainer.innerHTML = '';
      Object.entries(stats).forEach(([desp, data]) => {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = `${data.total * 10}px`;
        bar.textContent = data.total;
        chartContainer.appendChild(bar);
      });
    }

    // Guardar cambios manuales
    function guardarCambios() {
      alert('Cambios guardados.');
      actualizarEstadisticas();
    }

    // Reiniciar calendario
    function reiniciarCalendario() {
      crearCalendario();
      alert('Calendario reiniciado.');
      actualizarEstadisticas();
    }

    // Inicialización
    inicializarDespachadores();
    crearCalendario();
    actualizarEstadisticas();
  </script>
</body>
</html>
