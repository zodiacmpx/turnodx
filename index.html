<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Turnos Pro - Despachadores</title>
    <style>
        /* ESTILOS GENERALES */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            padding: 20px;
            overflow-x: hidden;
        }
        
        h1 { text-align: center; margin-bottom: 20px; color: #2c3e50; }

        /* CONTROLES */
        .controls {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }
        
        select, input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #2980b9; transform: translateY(-1px); }
        button.secondary { background: #95a5a6; }
        button.danger { background: #e74c3c; }
        button.save { background: #27ae60; }

        /* LEYENDA */
        .legend { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap;}
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 14px; }
        .box { width: 20px; height: 20px; border-radius: 3px; border: 1px solid #999; }

        /* CALENDARIO */
        .table-wrapper { overflow-x: auto; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            position: relative;
        }
        
        th { background: #2c3e50; color: white; position: sticky; top: 0; z-index: 10; }
        
        /* Columna de nombres fija */
        td:first-child {
            position: sticky;
            left: 0;
            background: white;
            z-index: 5;
            font-weight: bold;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        /* ESTILOS DE TURNOS */
        .dia { background: #ffeaa7; color: #d35400; font-weight: bold; }
        .tarde { background: #fab1a0; color: #c0392b; font-weight: bold; }
        .noche-sem { background: #74b9ff; color: #0984e3; font-weight: bold; } /* Azul claro */
        .noche-fds { background: #0984e3; color: white; font-weight: bold; } /* Azul fuerte */
        .libre { background: #55efc4; color: #00b894; font-weight: bold; }
        .domingo { background-color: #ffe6e6 !important; }

        /* ESTADO FIJO / BLOQUEADO */
        td.fijo {
            border: 2px solid #e74c3c !important;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        
        td.fijo::after {
            content: '🔒';
            position: absolute;
            top: 0px;
            right: 0px;
            font-size: 10px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            padding: 1px;
        }

        td.editable { cursor: pointer; user-select: none; }
        td.editable:hover { filter: brightness(0.95); }

        /* BADGES */
        .badge { font-size: 10px; padding: 2px 4px; border-radius: 3px; color: white; margin-left: 5px; }
        .badge-jefe { background: #8e44ad; }

        /* ALERTAS */
        .alert { padding: 10px; background: #d1ecf1; color: #0c5460; border-radius: 5px; margin-bottom: 15px; text-align: center;}
    </style>
</head>
<body>

    <div class="container">
        <h1>🗓️ Generador de Turnos Inteligente</h1>

        <div class="alert">
            <strong>Instrucciones:</strong> Clic izquierdo para cambiar turno manual. <strong>Clic derecho para BLOQUEAR (🔒)</strong> y proteger el turno del generador automático.
        </div>

        <div class="controls">
            <div>
                <label>Mes:</label>
                <select id="mes">
                    <option value="0">Enero</option>
                    <option value="1">Febrero</option>
                    <option value="2">Marzo</option>
                    <option value="3">Abril</option>
                    <option value="4">Mayo</option>
                    <option value="5">Junio</option>
                    <option value="6">Julio</option>
                    <option value="7">Agosto</option>
                    <option value="8">Septiembre</option>
                    <option value="9">Octubre</option>
                    <option value="10">Noviembre</option>
                    <option value="11">Diciembre</option>
                </select>
                <input type="number" id="anio" value="2025" style="width: 80px;">
            </div>

            <button onclick="generarTurnos()" title="Respeta los candados">⚡ Generar Automático</button>
            <button class="secondary" onclick="limpiarTablero(false)">🧹 Limpiar (Mantener Candados)</button>
            <button class="danger" onclick="limpiarTablero(true)">🗑️ Borrar Todo</button>
            <button class="save" onclick="guardarLocal()">💾 Guardar</button>
            <button class="save" onclick="cargarLocal()">📂 Cargar</button>
            <button onclick="exportarCSV()">📊 Excel</button>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="box dia"></div> Día (D)</div>
            <div class="legend-item"><div class="box tarde"></div> Tarde (T)</div>
            <div class="legend-item"><div class="box noche-sem"></div> Noche Sem (NS)</div>
            <div class="legend-item"><div class="box noche-fds"></div> Noche Finde (NF)</div>
            <div class="legend-item"><div class="box libre"></div> Libre (L)</div>
            <div class="legend-item"><div class="box" style="border: 2px solid #e74c3c; position:relative;"></div> <span style="font-size:12px">🔒 Bloqueado</span></div>
        </div>

        <div class="table-wrapper">
            <table id="tabla-turnos">
                <thead>
                    <tr id="header-row"></tr>
                </thead>
                <tbody id="body-rows"></tbody>
            </table>
        </div>

        <div id="stats" style="margin-top: 20px; padding: 10px; background: #eee; border-radius: 5px;"></div>
    </div>

    <script>
        // === CONFIGURACIÓN ===
        const personal = [
            { nombre: 'Omar Bastidas', zona: 'Valdivia', esJefe: false },
            { nombre: 'Jonathan Molina', zona: 'Valdivia', esJefe: false },
            { nombre: 'Brayan Carrillo', zona: 'Valdivia', esJefe: false },
            { nombre: 'Claudio Cheuquian', zona: 'Osorno', esJefe: false },
            { nombre: 'Esteban Gómez', zona: 'Osorno', esJefe: false },
            { nombre: 'Víctor Millár', zona: 'Osorno', esJefe: false },
            { nombre: 'Omar Millaguín', zona: 'Puertumont', esJefe: false },
            { nombre: 'Victor González', zona: 'Puertumont', esJefe: false },
            { nombre: 'Sebastián Fernández', zona: 'Puertumont', esJefe: false },
            { nombre: 'Claudio Bustos', zona: 'Chiloé', esJefe: false },
            { nombre: 'Isabel Alvarado', zona: 'Chiloé', esJefe: false },
            { nombre: 'René Asenjo', zona: 'Chiloé', esJefe: false },
            { nombre: 'Felipe Báez', zona: 'Chiloé', esJefe: false },
            { nombre: 'Emanuel Contreras', zona: 'Chiloé', esJefe: false },
            { nombre: 'Ruth Millár', zona: 'Chiloé', esJefe: false },
            { nombre: 'Jefe 1', zona: 'Jefatura', esJefe: true },
            { nombre: 'Jefe 2', zona: 'Jefatura', esJefe: true },
            { nombre: 'Jefe 3', zona: 'Jefatura', esJefe: true }
        ];

        // Estado Global
        let calendario = {}; // { "Nombre": ["D", "T", null, ...] }
        let diasBloqueados = {}; // { "Nombre": { 0: "D", 5: "L" } } -> Índices de días fijos

        // === INICIALIZACIÓN ===
        window.onload = () => {
            const fecha = new Date();
            document.getElementById('mes').value = fecha.getMonth();
            document.getElementById('anio').value = fecha.getFullYear();
            inicializarEstructura();
            renderizar();
        };

        function getDiasMes() {
            const m = parseInt(document.getElementById('mes').value);
            const a = parseInt(document.getElementById('anio').value);
            return new Date(a, m + 1, 0).getDate();
        }

        function inicializarEstructura() {
            const totalDias = getDiasMes();
            calendario = {};
            // Si no existen bloqueos previos, inicializamos vacío, si existen se mantienen
            if(!diasBloqueados) diasBloqueados = {}; 

            personal.forEach(p => {
                calendario[p.nombre] = new Array(totalDias).fill(null);
                // Asegurar que exista la entrada en bloqueados
                if (!diasBloqueados[p.nombre]) diasBloqueados[p.nombre] = {};
            });
        }

        // === RENDERIZADO ===
        function renderizar() {
            const m = parseInt(document.getElementById('mes').value);
            const a = parseInt(document.getElementById('anio').value);
            const totalDias = getDiasMes();
            const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

            // 1. Header
            let headerHTML = '<th>Personal</th>';
            for (let i = 1; i <= totalDias; i++) {
                const fecha = new Date(a, m, i);
                const diaSem = diasSemana[fecha.getDay()];
                const claseDom = fecha.getDay() === 0 ? 'domingo' : '';
                headerHTML += `<th class="${claseDom}">${i}<br>${diaSem}</th>`;
            }
            headerHTML += '<th>Total</th>';
            document.getElementById('header-row').innerHTML = headerHTML;

            // 2. Body
            let bodyHTML = '';
            personal.forEach(p => {
                let row = `<tr>`;
                row += `<td>${p.nombre} ${p.esJefe ? '<span class="badge badge-jefe">JEFE</span>' : ''}</td>`;
                
                let countTrabajo = 0;

                for (let i = 0; i < totalDias; i++) {
                    const turno = calendario[p.nombre][i] || '';
                    const esBloqueado = diasBloqueados[p.nombre][i] !== undefined;
                    
                    // Clase CSS según turno
                    let clase = '';
                    if (turno === 'D') clase = 'dia';
                    else if (turno === 'T') clase = 'tarde';
                    else if (turno === 'NS') clase = 'noche-sem';
                    else if (turno === 'NF') clase = 'noche-fds';
                    else if (turno === 'L') clase = 'libre';
                    
                    if (esBloqueado) clase += ' fijo';

                    const fecha = new Date(a, m, i+1);
                    if (fecha.getDay() === 0) clase += ' domingo';

                    if (turno && turno !== 'L') countTrabajo++;

                    row += `<td class="editable ${clase}" 
                                onclick="ciclarTurno('${p.nombre}', ${i})" 
                                oncontextmenu="toggleBloqueo(event, '${p.nombre}', ${i})">
                                ${turno}
                            </td>`;
                }
                
                row += `<td><strong>${countTrabajo}</strong></td></tr>`;
                bodyHTML += row;
            });
            document.getElementById('body-rows').innerHTML = bodyHTML;
            actualizarEstadisticas();
        }

        // === INTERACCIÓN MANUAL ===
        function ciclarTurno(nombre, diaIndex) {
            // Si está bloqueado, preguntar o impedir. Aquí permitimos cambiar pero mantiene el bloqueo.
            // Opcional: if (diasBloqueados[nombre][diaIndex]) return; 
            
            const turnos = [null, 'D', 'T', 'NS', 'NF', 'L'];
            const actual = calendario[nombre][diaIndex];
            let nuevoIdx = (turnos.indexOf(actual) + 1) % turnos.length;
            const nuevoTurno = turnos[nuevoIdx];

            calendario[nombre][diaIndex] = nuevoTurno;
            
            // Si estaba bloqueado, actualizamos el valor guardado en el bloqueo
            if (diasBloqueados[nombre][diaIndex] !== undefined) {
                diasBloqueados[nombre][diaIndex] = nuevoTurno;
            }

            renderizar();
        }

        function toggleBloqueo(e, nombre, diaIndex) {
            e.preventDefault(); // Evitar menú contextual del navegador
            
            const turnoActual = calendario[nombre][diaIndex];
            
            if (diasBloqueados[nombre][diaIndex] !== undefined) {
                // Desbloquear
                delete diasBloqueados[nombre][diaIndex];
            } else {
                // Bloquear (solo si hay un turno asignado, o permitir bloquear vacíos como Libres?)
                // Asumiremos que si está vacío (null) y se bloquea, se fuerza a 'L' o se queda vacío protegido.
                // Para simplificar, si es null lo convertimos a algo visible o lo dejamos null protegido.
                diasBloqueados[nombre][diaIndex] = turnoActual;
            }
            renderizar();
        }

        function limpiarTablero(borrarTodo) {
            if(confirm(borrarTodo ? "¿Borrar TODO incluyendo bloqueos?" : "¿Limpiar solo celdas no bloqueadas?")) {
                const totalDias = getDiasMes();
                
                if (borrarTodo) {
                    diasBloqueados = {};
                    personal.forEach(p => diasBloqueados[p.nombre] = {});
                }

                personal.forEach(p => {
                    for(let i=0; i<totalDias; i++) {
                        // Si NO borrarTodo y la celda está en bloqueados, la saltamos (la preservamos)
                        if (!borrarTodo && diasBloqueados[p.nombre][i] !== undefined) {
                            calendario[p.nombre][i] = diasBloqueados[p.nombre][i];
                        } else {
                            calendario[p.nombre][i] = null;
                        }
                    }
                });
                renderizar();
            }
        }

        // === LÓGICA DEL GENERADOR ===
        function generarTurnos() {
            // 1. Limpiar tablero respetando bloqueos
            limpiarTablero(false); // Llama a la limpieza interna sin confirmación visual explícita aquí
            
            const totalDias = getDiasMes();
            const m = parseInt(document.getElementById('mes').value);
            const a = parseInt(document.getElementById('anio').value);

            // 2. Aplicar bloqueos explícitamente (redundancia de seguridad)
            personal.forEach(p => {
                for (const [dia, turno] of Object.entries(diasBloqueados[p.nombre])) {
                    calendario[p.nombre][parseInt(dia)] = turno;
                }
            });

            // 3. Asignar Noches (Prioridad)
            // Nota: El algoritmo debe saltar celdas que ya tienen valor (!= null)
            asignarNoches(m, a, totalDias);

            // 4. Rellenar Días y Tardes
            personal.forEach(p => {
                rellenarResto(p, totalDias);
            });

            renderizar();
        }

        function asignarNoches(mes, anio, diasTotal) {
            // Lógica simplificada de noches: Intenta poner NS (Lun-Jue) y NF (Vie-Dom)
            // verificando que los días estén disponibles (null).
            
            let candidatos = personal.filter(p => !p.esJefe).sort(() => Math.random() - 0.5);
            
            for (let i = 0; i < diasTotal; i++) {
                const fecha = new Date(anio, mes, i + 1);
                const diaSem = fecha.getDay(); // 0 Dom, 1 Lun, ...

                // Detectar inicio Noche Semana (Lunes = 1)
                if (diaSem === 1 && (i + 3) < diasTotal) {
                    // Buscamos un candidato disponible para Lun, Mar, Mie, Jue
                    for (let p of candidatos) {
                        if (estaLibreRango(p.nombre, i, 4)) {
                            // Asignar
                            [0,1,2,3].forEach(offset => calendario[p.nombre][i+offset] = 'NS');
                            // Asignar libres post turno (ej. 2 días)
                            if (i+4 < diasTotal && !esFijo(p.nombre, i+4)) calendario[p.nombre][i+4] = 'L';
                            if (i+5 < diasTotal && !esFijo(p.nombre, i+5)) calendario[p.nombre][i+5] = 'L';
                            break; // Solo 1 persona por turno noche (ejemplo)
                        }
                    }
                }

                // Detectar inicio Noche Finde (Viernes = 5)
                if (diaSem === 5 && (i + 2) < diasTotal) {
                    for (let p of candidatos) {
                        if (estaLibreRango(p.nombre, i, 3)) {
                            [0,1,2].forEach(offset => calendario[p.nombre][i+offset] = 'NF');
                            // Libres post turno
                            if (i+3 < diasTotal && !esFijo(p.nombre, i+3)) calendario[p.nombre][i+3] = 'L';
                            if (i+4 < diasTotal && !esFijo(p.nombre, i+4)) calendario[p.nombre][i+4] = 'L';
                            break;
                        }
                    }
                }
            }
        }

        function rellenarResto(persona, totalDias) {
            let diasConsecutivos = 0;

            for (let i = 0; i < totalDias; i++) {
                // Si ya tiene turno (fijo o asignado por noche), saltar
                if (calendario[persona.nombre][i] !== null) {
                    if (calendario[persona.nombre][i] === 'L') diasConsecutivos = 0;
                    else diasConsecutivos++;
                    continue;
                }

                // Regla básica de descanso: max 6 días
                if (diasConsecutivos >= 6) {
                    calendario[persona.nombre][i] = 'L';
                    diasConsecutivos = 0;
                    continue;
                }

                // Aleatorio Día o Tarde
                // Jefes prefieren día, despachadores mixto
                const rand = Math.random();
                let turno = 'D';
                
                if (persona.esJefe) {
                    turno = rand > 0.8 ? 'T' : 'D'; // Jefes mayormente día
                } else {
                    turno = rand > 0.5 ? 'T' : 'D';
                }

                calendario[persona.nombre][i] = turno;
                diasConsecutivos++;
            }
        }

        // Helpers Lógica
        function estaLibreRango(nombre, inicio, longitud) {
            for (let k = 0; k < longitud; k++) {
                if (calendario[nombre][inicio + k] !== null) return false;
            }
            return true;
        }

        function esFijo(nombre, diaIndex) {
            return diasBloqueados[nombre][diaIndex] !== undefined;
        }

        // === UTILIDADES ===
        function actualizarEstadisticas() {
            const statsDiv = document.getElementById('stats');
            const totalDias = getDiasMes();
            // Calcular cobertura por día
            let html = '<h3>Cobertura Diaria</h3><div style="display:flex; gap:5px; flex-wrap:wrap; font-size:11px;">';
            
            for(let i=0; i<totalDias; i++) {
                let d=0, t=0, n=0;
                personal.forEach(p => {
                    const val = calendario[p.nombre][i];
                    if(val === 'D') d++;
                    if(val === 'T') t++;
                    if(val === 'NS' || val === 'NF') n++;
                });
                
                // Alerta visual si falta gente (ejemplo: menos de 2 en dia)
                let color = (d < 2 || t < 1) ? '#ffcccb' : '#c3e6cb';
                html += `<div style="background:${color}; padding:2px 5px; border:1px solid #999;">Día ${i+1}: D${d}/T${t}/N${n}</div>`;
            }
            html += '</div>';
            statsDiv.innerHTML = html;
        }

        function guardarLocal() {
            const estado = {
                mes: document.getElementById('mes').value,
                anio: document.getElementById('anio').value,
                calendario: calendario,
                bloqueos: diasBloqueados
            };
            localStorage.setItem('turnos_data', JSON.stringify(estado));
            alert('Guardado correctamente');
        }

        function cargarLocal() {
            const data = localStorage.getItem('turnos_data');
            if(data) {
                const estado = JSON.parse(data);
                document.getElementById('mes').value = estado.mes;
                document.getElementById('anio').value = estado.anio;
                calendario = estado.calendario;
                diasBloqueados = estado.bloqueos || {};
                renderizar();
            } else {
                alert('No hay datos guardados');
            }
        }

        function exportarCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Nombre,";
            const dias = getDiasMes();
            for(let i=1; i<=dias; i++) csvContent += i + ",";
            csvContent += "\n";

            personal.forEach(p => {
                let row = p.nombre + ",";
                for(let i=0; i<dias; i++) {
                    row += (calendario[p.nombre][i] || "") + ",";
                }
                csvContent += row + "\n";
            });

            var encodedUri = encodeURI(csvContent);
            var link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "turnos.csv");
            document.body.appendChild(link);
            link.click();
        }
    </script>
</body>
</html>
