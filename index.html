<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Turnos con Bloques de Noche (4 días)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      border-collapse: collapse;
      margin-bottom: 20px;
      width: 100%;
    }
    th, td {
      border: 1px solid #000;
      padding: 5px;
      text-align: center;
      font-size: 13px;
    }
    .controls {
      margin-bottom: 20px;
    }
    .controls button {
      margin-right: 10px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
    }
    h2 {
      margin-top: 30px;
    }
    .off {
      color: #999;
    }
  </style>
</head>
<body>
  <h1>Calendario de Turnos con Bloques de Noche (4 días)</h1>
  <div class="controls">
    <button onclick="generarTurnos()">Generar turnos</button>
  </div>

  <h2>Vista Diaria</h2>
  <table id="dailyTable">
    <thead>
      <tr>
        <th>Día</th>
        <th>Mañana</th>
        <th>Tarde</th>
        <th>Noche</th>
      </tr>
    </thead>
    <tbody>
      <!-- Se llenará dinámicamente -->
    </tbody>
  </table>

  <h2>Vista Mensual por Despachador</h2>
  <table id="monthlyTable">
    <thead>
      <tr>
        <th>Despachador</th>
        <!-- Columnas para cada día del mes se generarán dinámicamente -->
      </tr>
    </thead>
    <tbody>
      <!-- Se llenará dinámicamente -->
    </tbody>
  </table>

  <script>
    /************************************************
     * CONFIGURACIÓN Y LISTA DE DESPACHADORES
     ************************************************/
    const DIAS_EN_MES = 30;

    // Los turnos diarios:
    // - Mañana: entre 5 y 6
    // - Tarde: entre 3 y 5
    // - Noche: 1 (solo para días 1..28 con bloques de 4)
    
    const dispatchers = [
      "Victor Millar solis",
      "Victor Gonzalez",
      "Sebastian Fernandez",
      "Ruth Millar",
      "René Asenjo",
      "Omar Millaguin",
      "Omar Bastidas",
      "Jonathan Molina",
      "Isabel Alvarado",
      "Esteban Gómez",
      "Daniela Vargas",
      "Claudio Cheuquian",
      "Claudio bustos",
      "Brayan Carrillo",
      "Emanuel Contreras",
      "Felipe G"
    ];

    // Estructura de datos para la asignación:
    // Para cada día [1..30], guardamos: { morning: [], afternoon: [], night: [] }
    let assignments = [];

    // Para cada despachador, mantenemos su estado:
    // {
    //   offUntil: (día 1-indexado) => no puede trabajar antes de ese día
    //   lastShift: "M" | "T" | "N" | "off" => turno del día anterior
    //   totalAssigned: cuántos días ha trabajado (para balancear si se desea)
    // }
    let state = {};

    /************************************************
     * INICIALIZACIÓN
     ************************************************/
    function init() {
      assignments = [];
      for (let d = 1; d <= DIAS_EN_MES; d++) {
        assignments.push({
          day: d,
          morning: [],
          afternoon: [],
          night: []
        });
      }

      state = {};
      dispatchers.forEach(d => {
        state[d] = {
          offUntil: 1,
          lastShift: "off",
          totalAssigned: 0
        };
      });
    }

    /************************************************
     * REGLAS DE VALIDACIÓN PARA MAÑANA / TARDE
     ************************************************/
    // "vuelta corta":
    // - Si trabajó T ayer, no puede M hoy.
    // - Si trabajó N ayer, no puede M ni T hoy.
    // Además, no puede trabajar si offUntil > día actual.
    // Y obviamente, no puede trabajar mañana/tarde si ya está asignado a noche.
    
    function canWorkMorning(disp, day) {
      if (day < state[disp].offUntil) return false;
      const yesterdayShift = (day > 1) ? getShiftLetter(disp, day - 1) : "off";
      // si ayer fue T o N, no puede M hoy
      if (yesterdayShift === "T" || yesterdayShift === "N") return false;
      // si ya está asignado a noche en este día, no puede mañana
      if (assignments[day - 1].night.includes(disp)) return false;
      return true;
    }

    function canWorkAfternoon(disp, day) {
      if (day < state[disp].offUntil) return false;
      const yesterdayShift = (day > 1) ? getShiftLetter(disp, day - 1) : "off";
      // si ayer fue N, no puede T hoy
      if (yesterdayShift === "N") return false;
      // si ya está asignado a noche en este día, no puede tarde
      if (assignments[day - 1].night.includes(disp)) return false;
      return true;
    }

    // Para saber qué turno tuvo un despachador en un día anterior:
    function getShiftLetter(disp, day) {
      // day es 1-indexado, assignments[day-1]
      const dayObj = assignments[day - 1];
      if (dayObj.morning.includes(disp)) return "M";
      if (dayObj.afternoon.includes(disp)) return "T";
      if (dayObj.night.includes(disp)) return "N";
      return "off";
    }

    /************************************************
     * ASIGNACIÓN DE TURNOS DE NOCHE EN BLOQUES DE 4
     ************************************************/
    // Se crearán bloques de 4 días para los primeros 28 días:
    //  - Bloque 1: días 1-4
    //  - Bloque 2: días 5-8
    //  - ...
    //  - Bloque 7: días 25-28
    // Para día 29 y 30, NO se asigna turno de noche (para no romper la regla de 4 días seguidos).
    // Después de 4 días seguidos de noche, se fuerza 2 días libres.

    let nightIndex = 0; // índice para ir rotando despachadores

    function fillNightShifts() {
      const blockSize = 4;
      const totalBlocks = 7; // 7 bloques de 4 días => 28 días

      for (let b = 0; b < totalBlocks; b++) {
        const startDay = b * blockSize + 1;      // 1, 5, 9, 13, 17, 21, 25
        const endDay = startDay + blockSize - 1; // 4, 8, 12, 16, 20, 24, 28

        // Buscar un despachador disponible para 4 días seguidos de noche
        // Debe estar offUntil <= startDay
        // y no romper “vuelta corta” para día 1 (no es problema si day=1, no hay “ayer”).
        // Elegimos uno cíclicamente para simplificar.
        let assigned = false;
        let tries = 0;
        while (!assigned && tries < dispatchers.length) {
          let disp = dispatchers[nightIndex];
          nightIndex = (nightIndex + 1) % dispatchers.length;
          tries++;

          // Verificamos disponibilidad para los 4 días
          if (canWorkNightBlock(disp, startDay, endDay)) {
            // Asignamos
            for (let d = startDay; d <= endDay; d++) {
              assignments[d - 1].night.push(disp);
              state[disp].totalAssigned++;
            }
            // Forzamos 2 días libres después de endDay
            // => offUntil = endDay + 1 + 2 = endDay + 3
            // Pero si ya tenía un offUntil mayor, lo respetamos
            const newOff = endDay + 3;
            if (state[disp].offUntil < newOff) {
              state[disp].offUntil = newOff;
            }
            assigned = true;
          }
        }
      }
      // Para días 29 y 30, no asignamos noche (quedan vacíos).
    }

    // Revisa si el despachador puede trabajar 4 noches seguidas desde startDay hasta endDay.
    // 1) Debe tener offUntil <= startDay
    // 2) No puede tener restricción por el día anterior (turno de tarde) en startDay - 1 => 
    //    si startDay > 1 y trabajó tarde en day startDay - 1, no podría hacer noche. Pero la regla
    //    principal dice: “para noche se requiere haber descansado el día anterior”, es decir, “off” el día anterior.
    //    Verificamos eso también para startDay, startDay+1, etc., aunque la idea es “4 días consecutivos de noche”.
    function canWorkNightBlock(disp, startDay, endDay) {
      // Chequear si está disponible desde startDay
      if (state[disp].offUntil > startDay) return false;
      // Chequear que en el día anterior a startDay (si existe) el despachador haya estado off
      // para cumplir la regla “descansó el día anterior”. (Si startDay=1, no hay problema).
      if (startDay > 1) {
        const shiftYday = getShiftLetter(disp, startDay - 1);
        if (shiftYday !== "off") return false;
      }
      // Si el despachador ya trabajó en la simulación en días que se solapen, no debe romper la regla
      // (aunque con offUntil ya lo estamos controlando).
      // Asumimos que si offUntil <= startDay, puede hacer 4 días seguidos.
      // No hacemos verificación día a día, porque el “vuelta corta” se anula si va a estar
      // 4 días consecutivos en noche (y el día anterior a startDay debe ser off).
      return true;
    }

    /************************************************
     * ASIGNAR TURNOS DE MAÑANA Y TARDE
     ************************************************/
    function fillMorningAndAfternoon() {
      for (let d = 1; d <= DIAS_EN_MES; d++) {
        const dayIndex = d - 1;

        // Determinar cuántos se necesitan en la mañana y cuántos en la tarde
        const neededMorning = Math.random() < 0.5 ? 5 : 6;  // 5 o 6
        const neededAfternoon = randomInt(3, 5);            // entre 3 y 5

        // 1) Llenar la mañana
        let candidatesM = dispatchers.filter(disp => canWorkMorning(disp, d));
        // Ordenamos candidatos por menor totalAssigned para equilibrar
        candidatesM.sort((a, b) => state[a].totalAssigned - state[b].totalAssigned);
        for (let i = 0; i < neededMorning && i < candidatesM.length; i++) {
          const chosen = candidatesM[i];
          assignments[dayIndex].morning.push(chosen);
          state[chosen].totalAssigned++;
          // “lastShift” lo manejamos al final, de forma meramente visual si deseas
        }

        // 2) Llenar la tarde
        let candidatesT = dispatchers.filter(disp => canWorkAfternoon(disp, d));
        // Ordenamos también por menor totalAssigned
        candidatesT.sort((a, b) => state[a].totalAssigned - state[b].totalAssigned);
        for (let i = 0; i < neededAfternoon && i < candidatesT.length; i++) {
          const chosen = candidatesT[i];
          assignments[dayIndex].afternoon.push(chosen);
          state[chosen].totalAssigned++;
        }
      }
    }

    // Función auxiliar para generar enteros aleatorios entre min y max (incluidos)
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    /************************************************
     * ACTUALIZAR TABLAS (VISTA DIARIA Y VISTA MENSUAL)
     ************************************************/
    function actualizarVistaDiaria() {
      const tbody = document.getElementById("dailyTable").querySelector("tbody");
      tbody.innerHTML = "";
      for (let d = 1; d <= DIAS_EN_MES; d++) {
        const dayObj = assignments[d - 1];
        const row = document.createElement("tr");

        // Día
        const cellDay = document.createElement("td");
        cellDay.textContent = "Día " + d;
        row.appendChild(cellDay);

        // Mañana
        const cellM = document.createElement("td");
        cellM.textContent = dayObj.morning.join(", ");
        row.appendChild(cellM);

        // Tarde
        const cellT = document.createElement("td");
        cellT.textContent = dayObj.afternoon.join(", ");
        row.appendChild(cellT);

        // Noche
        const cellN = document.createElement("td");
        cellN.textContent = dayObj.night.join(", ");
        row.appendChild(cellN);

        tbody.appendChild(row);
      }
    }

    function actualizarVistaMensual() {
      const monthlyTable = document.getElementById("monthlyTable");
      const theadRow = monthlyTable.querySelector("thead tr");
      theadRow.innerHTML = "<th>Despachador</th>";
      for (let d = 1; d <= DIAS_EN_MES; d++) {
        const th = document.createElement("th");
        th.textContent = d;
        theadRow.appendChild(th);
      }

      const tbody = monthlyTable.querySelector("tbody");
      tbody.innerHTML = "";

      dispatchers.forEach(disp => {
        const row = document.createElement("tr");
        const cellName = document.createElement("td");
        cellName.textContent = disp;
        row.appendChild(cellName);

        // Para cada día, determinamos si está en M, T, N o off
        for (let d = 1; d <= DIAS_EN_MES; d++) {
          const dayObj = assignments[d - 1];
          const cell = document.createElement("td");
          let letter = "off";
          if (dayObj.morning.includes(disp)) letter = "M";
          else if (dayObj.afternoon.includes(disp)) letter = "T";
          else if (dayObj.night.includes(disp)) letter = "N";

          if (letter === "off") {
            cell.classList.add("off");
            cell.textContent = "off";
          } else {
            cell.textContent = letter;
          }
          row.appendChild(cell);
        }

        tbody.appendChild(row);
      });
    }

    /************************************************
     * PROCESO PRINCIPAL
     ************************************************/
    function generarTurnos() {
      init();
      // 1) Asignar bloques de noche (4 días) para días 1..28
      fillNightShifts();
      // 2) Asignar turnos de mañana y tarde (respetando vuelta corta y descansos)
      fillMorningAndAfternoon();
      // 3) Actualizar tablas
      actualizarVistaDiaria();
      actualizarVistaMensual();
    }

    // Inicializar y mostrar vacío
    init();
    actualizarVistaDiaria();
    actualizarVistaMensual();
  </script>
</body>
</html>
